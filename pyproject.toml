[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladder_pricer"
version = "0.4.0"
description = "Pure-Python Howard HJB ladder solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ladder_pricer*"]

[project.optional-dependencies]
app = ["streamlit>=1.30", "pandas>=2.0", "plotly>=5.0"]
